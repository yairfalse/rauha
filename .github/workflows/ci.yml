name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  quality:
    name: Workspace quality
    runs-on: arc-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config protobuf-compiler build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ebpf:
    name: eBPF build
    runs-on: arc-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential dwarves

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      - name: Build eBPF object and offsets
        run: cargo xtask build-ebpf

  privileged:
    if: github.event_name == 'push' && vars.RAUHA_PRIVILEGED_CI == 'true'
    uses: ./.github/workflows/privileged.yml
