name: Privileged Linux

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-rauha-privileged
  cancel-in-progress: false

jobs:
  runtime:
    name: Integration and oracle
    runs-on: arc-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y crun dwarves jq libssl-dev nftables pkg-config protobuf-compiler

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      # false-systems/sykli is private; the runner's GITHUB_TOKEN cannot read it.
      # SYKLI_READ_TOKEN must be a fine-grained PAT or GitHub App token with
      # contents:read on that repository. The token never lands on disk: it is
      # supplied to git through a credential helper for this step only.
      - name: Install Sykli
        env:
          SYKLI_READ_TOKEN: ${{ secrets.SYKLI_READ_TOKEN }}
        run: |
          if [ -z "$SYKLI_READ_TOKEN" ]; then
            echo "::error::SYKLI_READ_TOKEN is not set; the privileged gate needs a token with contents:read on false-systems/sykli (see issue #55)"
            exit 1
          fi
          git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$SYKLI_READ_TOKEN"; }; f'
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo install --git https://github.com/false-systems/sykli --rev 71d264367852c9f5df737f223be3b6efbf791ca8 --locked
          git config --global --unset credential.helper

      - name: Run locked security graph
        run: bash tests/security/run.sh

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauha-security-receipt
          path: .sykli/receipt.json
          if-no-files-found: error
