name: Privileged Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  runtime:
    name: Integration and oracle
    runs-on: [self-hosted, linux, rauha-bpf]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify BPF-LSM host
        run: |
          test -r /sys/kernel/btf/vmlinux
          grep -qw bpf /sys/kernel/security/lsm

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y dwarves libssl-dev nftables pkg-config protobuf-compiler

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker@0.11.0

      - name: Build runtime and eBPF
        run: |
          cargo build --workspace
          cargo xtask build-ebpf --release

      - name: Run integration tests and oracle
        env:
          RAUHA_BIN: target/debug/rauha
          RAUHA_ROOT: /var/lib/rauha-ci
        run: |
          sudo env RAUHA_ROOT="$RAUHA_ROOT" target/debug/rauhad >"$RUNNER_TEMP/rauhad.log" 2>&1 &
          daemon_pid=$!
          cleanup() {
            sudo kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
            sudo rm -rf "$RAUHA_ROOT"
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if target/debug/rauha zone list >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          target/debug/rauha zone list

          for test_script in tests/integration/*.sh; do
            sudo env RAUHA_BIN="$RAUHA_BIN" RAUHA_ROOT="$RAUHA_ROOT" bash "$test_script"
          done

          RAUHA_GRPC_ENDPOINT=http://[::1]:9876 cargo test --manifest-path eval/oracle/Cargo.toml
